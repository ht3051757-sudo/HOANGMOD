<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell"><section class="glass" style="padding:20px"><div class="brand">⚡ ADMIN PANEL</div><div id="login"><h2>Đăng nhập quản trị</h2><input id="u" placeholder="Username"><br><br><input id="p" type="password" placeholder="Password"><br><br><button id="loginBtn" class="buy">Đăng nhập</button><p id="msg"></p></div><div id="panel" style="display:none"><h2>Người dùng mới</h2><div id="users"></div><hr><h2>Thêm menu</h2><input id="title" placeholder="Tên menu"><br><br><input id="cat" placeholder="Danh mục, ví dụ menu/proxy"><br><br><input id="key" placeholder="Access key"><br><br><input id="url" placeholder="https://... link tải"><br><br><label><input id="vip" type="checkbox"> VIP</label> <label><input id="hot" type="checkbox"> HOT</label><br><br><button id="add" class="buy">Thêm</button><h2>Lịch sử nhận</h2><div id="claims"></div><h2>Chat cộng đồng</h2><button onclick="clearChat()">🗑️ Xoá toàn bộ tin nhắn</button></div></section></main><script>
const $=x=>document.getElementById(x);async function api(u,o={}){let r=await fetch(u,{headers:{"Content-Type":"application/json"},...o}),d=await r.json();if(!r.ok)throw Error(d.error||"Lỗi");return d}
$("loginBtn").onclick=async()=>{try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({username:$("u").value,password:$("p").value})});$("login").style.display="none";$("panel").style.display="block";load()}catch(e){$("msg").textContent=e.message}};
async function load(){let d=await api("/api/admin/users");$("users").innerHTML=d.users.map(u=>`<div class="glass" style="padding:12px;margin:8px 0"><b>${u.username}</b> · ${u.ip||"unknown"} · ${u.banned?"🔒 BANNED":"🟢 ACTIVE"} <button onclick="ban(${u.id},${u.banned})">${u.banned?"Mở ban":"Ban"}</button></div>`).join("");let c=await api("/api/admin/claims");$("claims").innerHTML=c.claims.map(x=>`<div>${x.username} → menu #${x.menu_id} · ${x.claimed_at}</div>`).join("")||"Chưa có";} 
async function ban(id,b){await api("/api/admin/users/"+id+"/"+(b?"unban":"ban"),{method:"POST"});load()}
$("add").onclick=async()=>{try{await api("/api/admin/menus",{method:"POST",body:JSON.stringify({title:$("title").value,category:$("cat").value||"menu",access_key:$("key").value,download_url:$("url").value,vip:$("vip").checked,hot:$("hot").checked})});alert("Đã thêm");load()}catch(e){alert(e.message)}}
async function clearChat(){if(!confirm("Xoá toàn bộ tin nhắn chat?"))return;await api("/api/admin/chat/messages",{method:"DELETE"});alert("Đã xoá chat");load()}
</script></body></html>
