<head>

<link rel="stylesheet" href="/style.css">

<div class="lightning"></div><div class="dragon-aura"></div>
<header class="topbar">
  <div class="brand">⚡ <span>⚡ HOANG MOD ⚡</span></div>
  <div class="icons">🔔 <button id="logoutBtn" class="mini">↪</button></div>
</header>

<main id="app" class="shell">
  <section class="profile glass">
    <div class="avatar">👤</div>
    <div><h2 id="username">Khách</h2><small id="joined">Chưa đăng nhập</small></div>
    <span class="member">👤 THÀNH VIÊN</span>

    <button>📋 Lịch sử</button><button>⭐ Wishlist</button><button>🏅 Huy hiệu</button>

  <div class="zalo-row"><a class="pill" href="https://zalo.me/g/naio8qpbb6wwjme4vsyf" target="_blank">🔗 ZALO</a></div>

  <section class="live glass">
    <b>🔴 LIVE — Ai vừa nhận</b><div id="liveList"></div>
  </section>

  <section id="community" class="chat glass">
    <div class="chat-head"><b>💬 CHAT CỘNG ĐỒNG</b><span id="chatStatus">Đang kết nối...</span></div>
    <div id="chatMessages" class="chat-messages"></div>
    <div class="chat-send"><input id="chatInput" maxlength="500" placeholder="Nhập tin nhắn..."><button id="chatSend">Gửi</button></div>
  </section>

  <section class="claim glass">
    <h3>🔑 NHẬP KEY NHẬN NỘI DUNG <small>(KHÔNG CẦN VƯỢT)</small></h3>
    <div class="claim-row"><input id="key" placeholder="Dán key tại đây..."><button id="claimBtn">Nhận</button></div>
  </section>

  <button class="buy">♛ MUA VIP / NẠP NGAY</button>

  <div class="search"><input id="search" placeholder="🔎 Tìm nội dung..."></div>
  <div class="filters">
    <span>Lọc:</span><button class="selected">Tất cả</button><button>♛ VIP</button><button>Free</button><button>Còn slot</button><button>🔥 Hot</button>
  </div>
  <div class="filters"><span>Sắp xếp:</span><button class="selected">Mặc định</button><button>Mới nhất</button><button>🔥 Hot</button><button>Chưa lấy</button></div>
  <div class="chips"><button class="selected">Tất cả</button><button>fake lag</button><button>menu</button><button>proxy</button></div>

<div id="auth" class="auth">

    <h2 id="authTitle">Đăng nhập</h2>
    <input id="authUser" maxlength="12" placeholder="Tên tài khoản">
    <input id="authPass" type="password" placeholder="Mật khẩu (tối thiểu 6 ký tự)">
    <button id="authBtn">Đăng nhập</button>
    <button id="toggleAuth" class="linkbtn">Chưa có tài khoản? Đăng ký</button>
    <p id="authMsg"></p>
  </div>
</div>
